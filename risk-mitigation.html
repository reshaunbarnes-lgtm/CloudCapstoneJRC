<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk Mitigation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container" style="padding: 4rem 0;">
    <header class="service-hero">
      <div class="hero-copy">
        <h1>Risk Mitigation</h1>
        <p class="lead">Reduce exposure with practical controls, policy, and ongoing monitoring.</p>
      </div>
      <figure class="hero-visual" aria-hidden="true">
        <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Risk mitigation illustration">
          <defs>
            <linearGradient id="riskTeal" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#14b8a6"/>
              <stop offset="100%" stop-color="#0f766e"/>
            </linearGradient>
          </defs>
          <circle class="visual-bg" cx="160" cy="190" r="110" fill="#14b8a6" opacity="0.2"/>
          <circle class="visual-bg" cx="380" cy="120" r="80" fill="url(#riskTeal)" opacity="0.18"/>
          <g class="visual-icon visual-bounce">
            <path d="M200 215 L235 165 L265 185 L305 145 L335 170 L385 120" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <circle class="visual-dot" cx="235" cy="165" r="12"/>
            <circle class="visual-dot" cx="305" cy="145" r="12"/>
            <circle class="visual-dot" cx="335" cy="170" r="12"/>
          </g>
          <rect x="340" y="190" width="90" height="80" rx="22" fill="#ffffff" opacity="0.18"/>
          <path d="M360 220 L390 250 L430 210" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
          <circle class="visual-dot" cx="420" cy="88" r="12"/>
          <circle class="visual-spark" cx="110" cy="80" r="8"/>
        </svg>
      </figure>
    </header>

    <section class="section">
      <div class="diagram">
        <h2>Mitigation Strategy</h2>
        <div class="diagram-row service-diagram">
          <div class="diagram-node node" style="--delay:0s;">Assess<br><small>Risk analysis</small></div>
          <div class="diagram-node node" style="--delay:0.12s;">Control<br><small>Technical & policy</small></div>
          <div class="diagram-node node" style="--delay:0.24s;">Monitor<br><small>Continuous checks</small></div>
          <div class="diagram-node node" style="--delay:0.36s;">Train<br><small>User awareness</small></div>
          <div class="diagram-node node" style="--delay:0.48s;">Improve<br><small>Iterate controls</small></div>
        </div>
      </div>
    </section>

    <p><a class="btn btn-secondary" href="index.html">Back to Home</a></p>
    <div id="visitor-counter" class="visitor-counter">Loading visitors...</div>
  </main>
  <script src="counter.js"></script>
</body>
</html>
