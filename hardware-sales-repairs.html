<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware Sales & Repairs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container" style="padding: 4rem 0;">
    <header class="service-hero">
      <div class="hero-copy">
        <h1>Hardware Sales &amp; Repairs</h1>
        <p class="lead">Quality parts, dependable repairs, and warranty-backed service for desktops and laptops.</p>
      </div>
      <figure class="hero-visual" aria-hidden="true">
        <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hardware sales and repairs illustration">
          <defs>
            <linearGradient id="repairsGold" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#f97316"/>
            </linearGradient>
          </defs>
          <circle class="visual-bg" cx="160" cy="190" r="105" fill="#f97316" opacity="0.2"/>
          <circle class="visual-bg" cx="390" cy="130" r="80" fill="#38bdf8" opacity="0.2"/>
          <g class="visual-icon visual-bounce">
            <circle cx="280" cy="170" r="48" fill="#ffffff" opacity="0.12"/>
            <path d="M260 145 L280 165 L320 130" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
            <path d="M225 195 L235 185 L285 235 L300 220 L250 170" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="180" y="210" width="90" height="60" rx="14" fill="#ffffff" opacity="0.18"/>
            <path d="M190 230 L190 255 L265 255 L265 230" fill="#ffffff" opacity="0.92"/>
          </g>
          <circle class="visual-spark" cx="440" cy="80" r="10"/>
          <circle class="visual-dot" cx="90" cy="250" r="12"/>
          <circle class="visual-spark" cx="350" cy="230" r="8"/>
        </svg>
      </figure>
    </header>

    <section class="section">
      <div class="diagram">
        <h2>Repair & Sales Workflow</h2>
        <div class="diagram-row service-diagram">
          <div class="diagram-node node" style="--delay:0s;">Diagnostics<br><small>Fault analysis</small></div>
          <div class="diagram-node node" style="--delay:0.12s;">Repair<br><small>Component fixes</small></div>
          <div class="diagram-node node" style="--delay:0.24s;">Testing<br><small>Quality checks</small></div>
          <div class="diagram-node node" style="--delay:0.36s;">Sales<br><small>Parts & upgrades</small></div>
          <div class="diagram-node node" style="--delay:0.48s;">Support<br><small>Follow-up</small></div>
        </div>
      </div>
    </section>

    <p><a class="btn btn-secondary" href="index.html">Back to Home</a></p>
    <div id="visitor-counter" class="visitor-counter">Loading visitors...</div>
  </main>
  <script src="counter.js"></script>
</body>
</html>
