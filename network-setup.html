<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Setup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container" style="padding: 4rem 0;">
    <header class="service-hero">
      <div class="hero-copy">
        <h1>Network Setup</h1>
        <p class="lead">Design, deploy, and secure wired and wireless networks for reliable connectivity.</p>
      </div>
      <figure class="hero-visual" aria-hidden="true">
        <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network setup illustration">
          <defs>
            <linearGradient id="networkBlue" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#60a5fa"/>
              <stop offset="100%" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
          <circle class="visual-bg" cx="160" cy="190" r="110" fill="url(#networkBlue)"/>
          <circle class="visual-bg" cx="385" cy="125" r="80" fill="#c084fc" opacity="0.22"/>
          <g class="visual-icon visual-bounce">
            <circle cx="180" cy="155" r="22" fill="#ffffff" opacity="0.92"/>
            <circle cx="335" cy="170" r="18" fill="#ffffff" opacity="0.92"/>
            <circle cx="260" cy="235" r="24" fill="#ffffff" opacity="0.92"/>
            <line class="visual-line" x1="200" y1="160" x2="255" y2="225"/>
            <line class="visual-line" x1="320" y1="170" x2="255" y2="225"/>
            <path class="visual-line" d="M210 130 C230 95 290 95 310 130"/>
          </g>
          <circle class="visual-spark" cx="430" cy="78" r="8"/>
          <circle class="visual-dot" cx="90" cy="250" r="12"/>
          <circle class="visual-spark" cx="440" cy="220" r="6"/>
        </svg>
      </figure>
    </header>

    <section class="section">
      <div class="diagram">
        <h2>Network Services</h2>
        <div class="diagram-row service-diagram">
          <div class="diagram-node node" style="--delay:0s;">Design<br><small>Topology & VLANs</small></div>
          <div class="diagram-node node" style="--delay:0.12s;">Routing<br><small>Gateways & BGP</small></div>
          <div class="diagram-node node" style="--delay:0.24s;">Security<br><small>Firewalls & VPN</small></div>
          <div class="diagram-node node" style="--delay:0.36s;">Wireless<br><small>AP planning</small></div>
          <div class="diagram-node node" style="--delay:0.48s;">Support<br><small>Monitoring & maintenance</small></div>
        </div>
      </div>
    </section>

    <p><a class="btn btn-secondary" href="index.html">Back to Home</a></p>
    <div id="visitor-counter" class="visitor-counter">Loading visitors...</div>
  </main>
  <script src="counter.js"></script>
</body>
</html>
